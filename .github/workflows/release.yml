name: Automatic Release Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: tdesktop:centos_env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          import re
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          pattern = r'if \(data\[i\] != \'l\'\s*\|\| data\[i \+ 1\] != \'n\'\s*\|\| data\[i \+ 2\] != \'g\'\s*\|\| data\[i \+ 3\] != \'_\''
          replacement = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\\n\\t\\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\\n\\t\\tif ((!isLng && !isAyu)'
          c, n = re.subn(pattern, replacement, c)
          print(f'Patched {n} occurrences in {p}')
          open(p, 'w').write(c)
          "

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y python3-jinja2
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          DOCKERFILE=$(DEBUG= LTO= python3 gen_dockerfile.py)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: |
            ${{ runner.os }}-libs-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          if [ -d "${{ runner.temp }}/.buildx-cache-new" ]; then
            rm -rf ${{ runner.temp }}/.buildx-cache
            mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache
          fi

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ${{ runner.os }}-linux-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-ccache-

      - name: Build Telegram Desktop
        run: |
          rm -rf out/Debug/gen/lang_subsets out/Release/gen/lang_subsets out/Debug/Telegram/gen/lang_subsets out/Release/Telegram/gen/lang_subsets
          mkdir -p "${{ env.CCACHE_DIR }}"
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          ${{ env.IMAGE_TAG }} \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Package Linux Binary
        run: |
          mkdir -p out/Release
          BIN_PATH=$(find out/ \( -name "AyuGram" -o -name "Telegram" \) -type f | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            BIN_NAME=$(basename "$BIN_PATH")
            BIN_DIR=$(dirname "$BIN_PATH")
            cd "$BIN_DIR"
            FILES="$BIN_NAME"
            test -f Updater && FILES="$FILES Updater"
            tar -czvf Linux.tar.gz $FILES
            if [ "$(realpath .)" != "$(realpath $GITHUB_WORKSPACE/out/Release)" ]; then
              cp Linux.tar.gz "$GITHUB_WORKSPACE/out/Release/Linux.tar.gz" || true
            fi
          else
            echo "Error: Binary not found under out/"
            find out/ -maxdepth 3 || true
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux
          path: out/Release/Linux.tar.gz

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/Linux.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-14
    env:
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_TYPE: "Release"
      CMAKE_PREFIX_PATH: "/opt/homebrew/opt/ffmpeg@6:/opt/homebrew/opt/openal-soft:/opt/homebrew/opt/openssl@3:/opt/homebrew/opt/qtbase:/opt/homebrew/opt/qtshadertools:/opt/homebrew/opt/qtsvg:/opt/homebrew/opt/qtimageformats:/opt/homebrew"
      PKG_CONFIG_PATH: "/opt/homebrew/opt/ffmpeg@6/lib/pkgconfig:/opt/homebrew/opt/openal-soft/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/opus/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"
      MANUAL_CACHING: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install dependencies via Homebrew
        run: |
          libs="ada-url ffmpeg@6 jpeg-xl libavif libheif minizip openal-soft openh264 openssl opus qtbase qtimageformats qtshadertools qtsvg xz"
          brew update
          brew upgrade || true
          brew install autoconf automake boost cmake libtool ninja pkg-config python $libs
          brew link --overwrite --force ffmpeg@6 openal-soft openssl@3 || true

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake || true

          xcodebuild -version > CACHE_KEY.txt
          brew list --versions $libs >> CACHE_KEY.txt || true
          echo "$MANUAL_CACHING" >> CACHE_KEY.txt
          echo "$GITHUB_WORKSPACE" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(md5 -q CACHE_KEY.txt)" >> $GITHUB_ENV

          QT_MIN_VER=$(grep 'set(QT_SUPPORTED_MIN_MACOS_VERSION' /opt/homebrew/Cellar/qtbase/*/lib/cmake/Qt6/Qt6ConfigExtras.cmake 2>/dev/null | head -n 1 | sed -E 's/^.*"(.*)"\)$/\1/')
          if [ -n "$QT_MIN_VER" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=$QT_MIN_VER" >> $GITHUB_ENV
          fi

          echo "LibrariesPath=$RUNNER_TEMP/Libraries" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/Libraries/local"

          RNNOISE_SHA=$(git ls-remote https://github.com/xiph/rnnoise.git HEAD | awk '{print $1}')
          echo "RNNOISE=$RNNOISE_SHA" >> $GITHUB_ENV

          WEBRTC_SHA=$(git ls-remote https://github.com/desktop-app/tg_owt.git HEAD | awk '{print $1}')
          echo "WEBRTC=$WEBRTC_SHA" >> $GITHUB_ENV

          ALL_PKG_CONFIG=$(find /opt/homebrew/Cellar /opt/homebrew/opt -name "pkgconfig" -type d 2>/dev/null | tr '\n' ':')
          echo "PKG_CONFIG_PATH=${ALL_PKG_CONFIG}/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "/opt/homebrew/opt/qtbase/bin:/opt/homebrew/opt/qtshadertools/bin" >> $GITHUB_PATH

      - name: RNNoise cache
        id: cache-rnnoise
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.os }}-rnnoise-${{ env.RNNOISE }}-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-rnnoise-

      - name: Build RNNoise
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$LibrariesPath/local"
          cd "$LibrariesPath"
          git clone --depth=1 https://github.com/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix="$LibrariesPath/local/rnnoise" --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache
        id: cache-webrtc
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.os }}-webrtc-${{ env.WEBRTC }}-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-webrtc-

      - name: Build WebRTC (tg_owt)
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$LibrariesPath/local"
          cd "$LibrariesPath"
          git clone --depth=1 --recursive --shallow-submodules https://github.com/desktop-app/tg_owt.git
          cd tg_owt
          ALL_PKG_CONFIG=$(find /opt/homebrew/Cellar /opt/homebrew/opt -name "pkgconfig" -type d 2>/dev/null | tr '\n' ':')
          export PKG_CONFIG_PATH="${ALL_PKG_CONFIG}/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:$PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --modversion libavcodec || pkg-config --print-errors libavcodec || true
          cmake -Bbuild . \
            -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$LibrariesPath/local/tg_owt" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DPKG_CONFIG_USE_CMAKE_PREFIX_PATH=ON
          cmake --build build -j$(sysctl -n hw.logicalcpu)
          cmake --install build

      - name: TDE2E cache
        id: cache-tde2e
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.os }}-tde2e-${{ env.TDE2E }}-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-tde2e-

      - name: Build TDE2E
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$LibrariesPath/local"
          cd "$LibrariesPath"
          git init tde2e
          cd tde2e
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth=1 origin "$TDE2E"
          git reset --hard FETCH_HEAD
          cmake -Bbuild . \
            -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$LibrariesPath/local/tde2e" \
            -DTD_E2E_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
          cmake --build build -j$(sysctl -n hw.logicalcpu)
          cmake --install build

      - name: Patch codegen scanner for ayu_ prefix
        run: |
          python3 -c "
          import re
          p = 'Telegram/codegen/codegen/lang/subsets.cpp'
          c = open(p).read()
          pattern = r'if \(data\[i\] != \'l\'\s*\|\| data\[i \+ 1\] != \'n\'\s*\|\| data\[i \+ 2\] != \'g\'\s*\|\| data\[i \+ 3\] != \'_\''
          replacement = 'const auto isLng = (data[i] == \'l\' && data[i + 1] == \'n\' && data[i + 2] == \'g\' && data[i + 3] == \'_\');\\n\\t\\tconst auto isAyu = (data[i] == \'a\' && data[i + 1] == \'y\' && data[i + 2] == \'u\' && data[i + 3] == \'_\');\\n\\t\\tif ((!isLng && !isAyu)'
          c, n = re.subn(pattern, replacement, c)
          print(f'Patched {n} occurrences in {p}')
          open(p, 'w').write(c)
          "

      - name: Configure and Build AyuGram
        run: |
          ALL_PKG_CONFIG=$(find /opt/homebrew/Cellar /opt/homebrew/opt -name "pkgconfig" -type d 2>/dev/null | tr '\n' ':')
          export PKG_CONFIG_PATH="${ALL_PKG_CONFIG}/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:$PKG_CONFIG_PATH"
          LOCAL_PREFIXES=$(find "$LibrariesPath/local" -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$LOCAL_PREFIXES"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          XCODE_VER=$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)
          EXTRA_FLAGS=""
          if [ "$XCODE_VER" -lt 16 ]; then
            echo "Xcode version is < 16 ($XCODE_VER), disabling Swift 6..."
            EXTRA_FLAGS="$EXTRA_FLAGS -DDESKTOP_APP_DISABLE_SWIFT6=ON"
          fi

          cmake -Bbuild . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDESKTOP_APP_USE_PACKAGED=ON \
            -DPKG_CONFIG_USE_CMAKE_PREFIX_PATH=ON \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            $EXTRA_FLAGS

          cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Package macOS DMG
        run: |
          APP_PATH=$(find build -name "*.app" -maxdepth 2 -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            echo "Found $APP_NAME at $APP_PATH"
            /opt/homebrew/opt/qtbase/bin/macdeployqt "$APP_PATH" || macdeployqt "$APP_PATH"
            codesign --remove-signature "$APP_PATH" || true
            mkdir -p out/Release
            hdiutil create -volname "AyuGram" -srcfolder "$APP_PATH" -ov -format UDZO out/Release/macOS.dmg
          else
            echo "Error: Application bundle (*.app) not found under build/"
            find build -maxdepth 3 || true
            exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS
          path: out/Release/macOS.dmg
          if-no-files-found: warn

      - name: Upload macOS Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: out/Release/macOS.dmg


